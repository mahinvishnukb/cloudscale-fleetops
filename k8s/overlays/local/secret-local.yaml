# LOCAL CLUSTER ONLY. These values are deliberately fake and throwaway — the cluster
# lives in Docker on your laptop and is deleted with `k3d cluster delete fleetops`.
#
# Never copy this pattern to a real environment. There, the secret comes from AWS
# Secrets Manager via External Secrets or the Secrets Store CSI driver, and the pod
# authenticates with IRSA rather than static credentials.
apiVersion: v1
kind: Secret
metadata:
  name: fleetops-api-secrets
  namespace: fleetops
type: Opaque
stringData:
  ConnectionStrings__FleetOpsDb: 'Host=postgres;Port=5432;Database=fleetops;Username=fleetops;Password=localdev'
  Jwt__Key: 'local-development-only-signing-key-do-not-reuse-0000'
  Database__SeedDemoData: 'true'
  Database__DemoPassword: 'localdev-demo-password'
