apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleetops-api
  namespace: fleetops
  annotations:
    # k3d ships Traefik. On EKS this would be the AWS Load Balancer Controller
    # (kubernetes.io/ingress.class: alb) with an ACM certificate ARN.
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: fleetops.localtest.me # resolves to 127.0.0.1 without editing /etc/hosts
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fleetops-api
                port:
                  name: http
