apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleetops-api
  namespace: fleetops
  labels:
    app.kubernetes.io/name: fleetops-api
    app.kubernetes.io/part-of: fleetops
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: fleetops-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # never drop below the desired count during a rollout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleetops-api
        app.kubernetes.io/part-of: fleetops
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/mahinvishnukb/fleetops-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: fleetops-api-config
            - secretRef:
                name: fleetops-api-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              # No CPU limit on purpose: CFS throttling hurts p99 latency far more
              # than the noisy-neighbour risk it prevents. Memory is still capped.
              memory: 512Mi
          # Startup probe covers the slow first boot (migrations, JIT). Until it passes,
          # the liveness probe is not evaluated, so a slow start is not mistaken for a hang.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            # Readiness checks the database, so a pod that loses Postgres is pulled
            # out of the Service without being restarted.
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      # Give in-flight requests time to drain before SIGTERM lands.
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: fleetops-api
