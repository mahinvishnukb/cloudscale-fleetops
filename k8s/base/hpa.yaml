apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fleetops-api
  namespace: fleetops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fleetops-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Scale down slowly; telemetry traffic is bursty and flapping replicas
      # drops SignalR connections.
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
