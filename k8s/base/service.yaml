apiVersion: v1
kind: Service
metadata:
  name: fleetops-api
  namespace: fleetops
  labels:
    app.kubernetes.io/name: fleetops-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fleetops-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  # SignalR needs a client to keep hitting the same pod for the life of a connection.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
